<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sayeed Speed X</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand">
      <div class="icon-shell"><img class="brand-icon" src="icons/icon128.png" alt="SX"></div>
      <div class="brand-copy">
        <h1>Sayeed <span>Speed X</span></h1>
        <p>VIDEO SPEED CONTROLLER</p>
      </div>
    </div>
    <label class="power" aria-label="Enable speed controller">
      <input id="enabled" type="checkbox" checked>
      <span class="power-track"><i></i><b>ON</b></span>
    </label>
  </header>

  <section class="hero">
    <div class="hero-topline">
      <span class="eyebrow">CURRENT SPEED</span>
      <span class="mode-badge" id="modeBadge">NORMAL</span>
    </div>
    <div class="speed-readout"><span id="bigSpeed">1</span><em>x</em></div>
    <div class="rail">
      <input id="speedSlider" type="range" min="0" max="64" step="0.01" value="1" aria-label="Fine speed control">
    </div>
    <div class="rail-labels"><span>0x</span><span>64x</span></div>
  </section>

  <section class="section preset-section">
    <div class="section-title">
      <div>
        <h2>Speed Map</h2>
        
      </div>
      <span class="range-tag">0 — 64x</span>
    </div>

    <div class="speed-map" role="group" aria-label="Speed presets">
      <button class="speed-chip stop" data-speed="0"><span>0</span><small>STOP</small></button>
      <button class="speed-chip" data-speed="0.25"><span>0.25</span><small>SLOW</small></button>
      <button class="speed-chip" data-speed="0.5"><span>0.5</span><small>SLOW</small></button>
      <button class="speed-chip" data-speed="1"><span>1</span><small>BASE</small></button>
      <button class="speed-chip" data-speed="2"><span>2</span><small>FLOW</small></button>
      <button class="speed-chip" data-speed="4"><span>4</span><small>FAST</small></button>
      <button class="speed-chip" data-speed="8"><span>8</span><small>TURBO</small></button>
      <button class="speed-chip" data-speed="16"><span>16</span><small>NATIVE</small></button>
      <button class="speed-chip turbo" data-speed="32"><span>32</span><small>HYPER</small></button>
      <button class="speed-chip turbo" data-speed="64"><span>64</span><small>MAX</small></button>
    </div>

  </section>

  <section class="section custom-section">
    <div class="section-title">
      <div>
        <h2>Precision Control</h2>
        
      </div>
      
    </div>
    <div class="custom-row">
      <button id="minus" class="step" aria-label="Decrease speed">−</button>
      <div class="input-box">
        <input id="customSpeed" type="number" min="0" max="64" step="0.01" value="1" aria-label="Custom speed">
        <span>x</span>
      </div>
      <button id="plus" class="step" aria-label="Increase speed">+</button>
    </div>
    
  </section>

  <footer>
    <span>Sayeed Speed X</span><span>V1.0</span>
  </footer>
</main>
<script src="popup.js"></script>
</body>
</html>
